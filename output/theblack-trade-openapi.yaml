          type: string
        orderId:
          type: string
          nullable: true
        status:
          type: string
        payload:
          type: object
          additionalProperties: true
    AdminOrderReviewRequest:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision:
          type: string
          enum: [APPROVE, REJECT]
        comment:
          type: string
          maxLength: 1000
    AdminPaymentConfirmationRequest:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision:
          type: string
          enum: [CONFIRM, REJECT]
        comment:
          type: string
          maxLength: 1000
    AdminSettleOrderRequest:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          type: string
          enum: [MANUAL, PROVIDER_API]
