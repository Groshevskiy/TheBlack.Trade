name: Verification

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Static and HTTP verification
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/astro-web/package-lock.json

      - name: Install API dependencies
        run: npm --prefix apps/api ci

      - name: Install web dependencies
        run: npm --prefix apps/astro-web ci

      - name: Run static verification
        run: npm run verify:static

      - name: Start API dependencies
        run: docker compose up -d postgres redis minio directus api

      - name: Show API logs on failure
        if: failure()
        run: docker compose logs --no-color api

      - name: Apply database schema
        run: docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U theblacktrade -d theblacktrade < infrastructure/db/migrations/0001_initial_schema.sql

      - name: Seed reference data
        run: docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U theblacktrade -d theblacktrade < infrastructure/db/seeds/001_reference_seed.sql

      - name: Bootstrap summary smoke fixture
        env:
          DATABASE_URL: postgresql://theblacktrade:theblacktrade@localhost:55432/theblacktrade
        run: npm --prefix apps/api run seed:smoke:summary

      - name: Run API readiness and HTTP summary checks
        env:
          API_READY_TIMEOUT_MS: 60000
          API_READY_INTERVAL_MS: 1000
        run: |
          npm run verify:ready
          npm run verify:http

      - name: Stop local stack
        if: always()
        run: docker compose down -v
