name: Verification

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Static and HTTP verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/astro-web/package-lock.json

      - name: Install API dependencies
        run: npm --prefix apps/api ci

      - name: Install web dependencies
        run: npm --prefix apps/astro-web ci

      - name: Run static verification
        run: npm run verify:static

      - name: Start API dependencies
        run: docker compose up -d postgres redis minio directus api

      - name: Show API logs on failure
        if: failure()
        run: docker compose logs --no-color api

      - name: Run API readiness and HTTP summary checks
        env:
          API_READY_TIMEOUT_MS: 60000
          API_READY_INTERVAL_MS: 1000
        run: |
          npm run verify:ready
          npm run verify:http

      - name: Stop local stack
        if: always()
        run: docker compose down -v
